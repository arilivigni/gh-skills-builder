name: Plugin CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Validate manifest, component discovery and content consistency
        run: python3 scripts/validate-content.py --online

      - name: Test packaging validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate README local markdown links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          repo_root = Path(".").resolve()
          readme = repo_root / "README.md"
          text = readme.read_text(encoding="utf-8")
          pattern = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          failures = []

          for target in pattern.findall(text):
            clean = target.strip()
            if not clean or clean.startswith("#"):
              continue
            if clean.startswith(("http://", "https://", "mailto:")):
              continue

            parsed = urlparse(clean)
            path_part = parsed.path
            if not path_part:
              continue

            base = repo_root if path_part.startswith("/") else readme.parent
            resolved = (base / path_part.lstrip("/")).resolve()
            try:
              resolved.relative_to(repo_root)
            except ValueError:
              failures.append(f"Link escapes repository root: {clean}")
              continue

            if not resolved.exists():
              failures.append(f"Broken local link target: {clean}")

          if failures:
            print("README link failures:")
            for failure in failures:
              print(f"- {failure}")
            raise SystemExit(1)

          print("README link validation passed.")
          PY
